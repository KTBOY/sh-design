<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js R185 Canvas Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 30%, #0b1026 0%, #05070f 70%);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* 全屏 3D 背景容器 —— 对应 open-codereview.ai 中包裹 canvas 的 section */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    #scene canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* 上层内容示例 */
    .overlay {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #e7ecff;
      pointer-events: none;
    }
    .overlay h1 {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #8ab4ff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .overlay p {
      margin-top: 16px;
      font-size: clamp(14px, 2vw, 18px);
      color: #9aa6c9;
      max-width: 540px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- 3D 背景容器 -->
  <div id="scene"></div>

  <!-- 上层文字内容 -->
  <div class="overlay">
    <h1>Open Code Review</h1>
    <p>Three.js r185 全屏 3D 背景示例 —— 飘动的粒子点云，自动带上 data-engine 标记。</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('scene');

    // ---------- 场景 / 相机 / 渲染器 (等价于 react-three-fiber 的 <Canvas>) ----------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070f, 0.0016);

    const camera = new THREE.PerspectiveCamera(
      60,
      container.clientWidth / container.clientHeight,
      0.1,
      2000
    );
    camera.position.set(0, 0, 420);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);

    // 关键:react-three-fiber 渲染的 canvas 会自动写入 data-engine 属性
    // 这里手动对齐 open-codereview.ai 的标记
    renderer.domElement.setAttribute('data-engine', 'three.js r185');
    container.appendChild(renderer.domElement);

    // ---------- 粒子点云 (飘动的星点效果) ----------
    const COUNT = 6000;
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const speeds = new Float32Array(COUNT);

    const colorA = new THREE.Color(0x8ab4ff);
    const colorB = new THREE.Color(0xc4b5fd);

    for (let i = 0; i < COUNT; i++) {
      const i3 = i * 3;
      // 在一个球体范围内随机分布
      const r = 200 + Math.random() * 400;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i3 + 2] = r * Math.cos(phi);

      const c = colorA.clone().lerp(colorB, Math.random());
      colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;

      speeds[i] = 0.2 + Math.random() * 0.8;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 1.6,
      sizeAttenuation: true,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // ---------- 动画循环 (等价于 react-three-fiber 的 useFrame) ----------
    const clock = new THREE.Clock();

    function animate() {
      const t = clock.getElapsedTime();

      // 整体缓慢自转
      points.rotation.y = t * 0.04;
      points.rotation.x = Math.sin(t * 0.1) * 0.15;

      // 单个粒子上下漂浮
      const pos = geometry.attributes.position.array;
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        pos[i3 + 1] += Math.sin(t * speeds[i] + i) * 0.05;
      }
      geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // ---------- 自适应窗口大小 ----------
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
  </script>
</body>
</html>
