name: Publish to npm

# Publishes the `sh-design` package via npm Trusted Publishing (OIDC) — no token.
# Prerequisite: on npmjs.com, configure a Trusted Publisher for `sh-design`
# pointing to this repository (KTBOY/sh-design) and this workflow (publish-npm.yml).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; runners ship npm 10.x.
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      # No NPM_TOKEN: npm authenticates via OIDC using the configured Trusted
      # Publisher and attaches build provenance automatically.
      - name: Publish sh-design (OIDC Trusted Publishing)
        run: npm publish --access public
        working-directory: packages/sh-design
